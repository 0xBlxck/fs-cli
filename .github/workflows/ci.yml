name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read        # aucun droit d'écriture, aucun secret utilisé

jobs:
  test:
    runs-on: windows-latest        # les tests utilisent PowerShell
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (aucun appel à la vraie API)
        run: npm test
      - name: Scan de secrets et de données personnelles
        run: npm run scan

  portable:
    # macOS (Apple Silicon et Intel) et Linux : la suite COMPLÈTE (npm test), bloquante. Les tests de commandes PowerShell
    # sont marqués Windows seulement et sautés ici.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Architecture (macos-15 doit être Apple Silicon, sans Rosetta)
        if: matrix.os == 'macos-15'
        run: |
          node -p "process.arch + ' ' + process.platform"
          test "$(uname -m)" = "arm64"
          test "$(node -p process.arch)" = "arm64"
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = "0"
      - name: Syntaxe de tous les fichiers
        run: for f in cli.js mcp-cli.js src/*.js src/tui/*.js vscode/*.js vscode/media/*.js vscode/scripts/*.mjs; do node --check "$f" || exit 1; done
      - name: Tests (aucun appel à la vraie API)
        run: npm test
