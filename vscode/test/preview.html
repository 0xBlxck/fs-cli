<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Aperçu hors VS Code : variables de thème sombre + faux pont, puis une session simulée. -->
<style>
:root {
  --vscode-foreground: #cccccc; --vscode-descriptionForeground: #9d9d9d; --vscode-editor-background: #1f1f1f; --vscode-sideBar-background: #181818;
  --vscode-input-background: #2a2a2a; --vscode-widget-border: #3c3c3c; --vscode-focusBorder: #0078d4; --vscode-font-family: 'Segoe UI', sans-serif; --vscode-font-size: 13px;
  --vscode-editor-font-family: Consolas, monospace; --vscode-textLink-foreground: #4daafc; --vscode-button-background: #0078d4; --vscode-button-foreground: #fff;
  --vscode-list-hoverBackground: #2a2d2e; --vscode-textCodeBlock-background: #2b2b2b;
}
</style>
<link rel="stylesheet" href="../media/panel.css"></head>
<body data-logo="../media/logo.png"><div id="app"></div>
<script>
window.sent = [];
window.acquireVsCodeApi = () => ({ postMessage: m => window.sent.push(m), setState() {}, getState() {} });
</script>
<script src="../media/panel.js"></script>
<script>
const E = ev => window.postMessage({ type: 'event', ev }, '*');
const steps = [
  () => E({ type: 'ready', models: [{ id: '-2003', name: 'Claude Sonnet 5.5' }, { id: '-2001', name: 'Claude Opus 5.5' }], modes: [{ id: 'auto' }, { id: 'edits' }, { id: 'ask' }, { id: 'plan' }], commands: ['/new', '/plan', '/changes'] }),
  () => E({ type: 'status', model: 'Claude Sonnet 5.5', modelId: -2003, mode: 'edits', cwd: 'C:\\Users\\moi\\monsite', ctx: 12, title: 'Ajoute un formulaire de contact' }),
  () => window.postMessage({ type: 'context', ctx: { rel: 'src/app.js', start: 12, end: 20, lines: 9 }, enabled: true }, '*'),
  () => { document.querySelector('textarea').value = 'Ajoute un formulaire de contact'; document.querySelector('.send').click(); },
  () => E({ type: 'busy', busy: true }),
  () => E({ type: 'spinner', label: 'Élaboration…' }),
  () => E({ type: 'tool', name: 'list_dir', tag: '▤', label: 'Lister', detail: '.', explore: true }),
  () => E({ type: 'toolDone', ok: true }),
  () => E({ type: 'tool', name: 'read_file', tag: '◇', label: 'Lire', detail: 'index.html', explore: true }),
  () => E({ type: 'toolDone', ok: true }),
  () => E({ type: 'tasks', list: [{ state: 'done', text: 'Lire la page d\'accueil' }, { state: 'doing', text: 'Créer le formulaire' }, { state: 'todo', text: 'Ajouter le style' }] }),
  () => E({ type: 'text', delta: 'Je vais ajouter le formulaire dans **index.html** et un peu de style.\n\n| Fichier | Rôle |\n|---|---|\n| `index.html` | page |\n| `style.css` | style |\n' }),
  () => E({ type: 'textEnd' }),
  () => E({ type: 'tool', name: 'edit_file', tag: '✎', label: 'Modifier', detail: 'index.html', explore: false }),
  () => E({ type: 'toolDone', ok: true }),
  () => E({ type: 'diff', added: 3, removed: 1, lines: [{ t: ' ', n: 11, line: '  <main>' }, { t: '-', n: 12, line: '    <p>Bientôt</p>' }, { t: '+', n: 12, line: '    <form id="contact">' }, { t: '+', n: 13, line: '      <input name="email" type="email">' }, { t: '+', n: 14, line: '    </form>' }, { t: ' ', n: 15, line: '  </main>' }] }),
  () => E({ type: 'tool', name: 'shell', tag: '>_', label: 'Commande', detail: 'npm test', explore: false }),
  () => E({ type: 'select', id: 1, title: 'Lancer cette commande ? npm test', detail: 'npm test\n(dossier : C:\\Users\\moi\\monsite)', options: ['Oui', 'Oui, et ne plus demander pour les commandes', 'Non'], defaultIndex: 0 }),
  () => { document.querySelector('.ask .opt').click(); },
  () => E({ type: 'toolLive', line: '> monsite@1.0.0 test' }),
  () => E({ type: 'toolLive', line: '✔ 4 tests réussis' }),
  () => E({ type: 'toolDone', ok: true }),
  () => E({ type: 'text', delta: 'C\'est fait. Le formulaire envoie vers `/api/contact` :\n\n```js app.js\nform.addEventListener("submit", send);\n```\n' }),
  () => E({ type: 'textEnd' }),
  () => E({ type: 'print', text: '\n\x1b[38;2;128;134;146m  ✻ Terminé en 18,4 s · 4 outils · 3 requêtes\x1b[39m\n' }),
  () => E({ type: 'changes', files: [{ path: 'C:\\Users\\moi\\monsite\\index.html', rel: 'index.html', added: 3, removed: 1 }, { path: 'C:\\Users\\moi\\monsite\\style.css', rel: 'style.css', added: 12, removed: 0, created: true }] }),
  () => E({ type: 'busy', busy: false }),
];
if (location.hash === "#accueil") steps.length = 3;
let k = 0; (function next() { if (k < steps.length) { steps[k++](); setTimeout(next, 30); } else document.title = 'fini'; })();
</script></body></html>
